# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: kdahlborn
# "service" is the name of this project. This will also be added to your AWS resource names.
service: shui-backend

provider:
    name: aws
    runtime: nodejs24.x
    architecture: arm64
    region: eu-north-1
    iam:
        role: ${file(./config.yml):role}
    environment:
        JWT_SECRET: ${env:JWT_SECRET}

resources:
    Resources:
        MessageTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: shui-db
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: PK
                      AttributeType: S
                    - AttributeName: SK
                      AttributeType: S
                    - AttributeName: GSI1PK
                      AttributeType: S
                    - AttributeName: GSI1SK
                      AttributeType: S
                KeySchema:
                    - AttributeName: PK
                      KeyType: HASH
                    - AttributeName: SK
                      KeyType: RANGE

                GlobalSecondaryIndexes:
                    - IndexName: GSI1
                      KeySchema:
                          - AttributeName: GSI1PK
                            KeyType: HASH
                          - AttributeName: GSI1SK
                            KeyType: RANGE
                      Projection:
                          ProjectionType: ALL

functions:
    ## MESSAGES
    getMessages:
        handler: functions/messages/getMessages/index.handler
        events:
            - httpApi:
                  path: /messages
                  method: GET
    getUserMessages:
        handler: functions/messages/getUserMessages/index.handler
        events:
            - httpApi:
                  path: /users/{username}/messages
                  method: GET
    createMessage:
        handler: functions/messages/createMessage/index.handler
        events:
            - httpApi:
                  path: /messages
                  method: POST
    updateMessage:
        handler: functions/messages/updateMessage/index.handler
        events:
            - httpApi:
                  path: /messages/{id}
                  method: PUT
    deleteMessage:
        handler: functions/messages/deleteMessage/index.handler
        events:
            - httpApi:
                  path: /messages/{id}
                  method: DELETE

    ## AUTH
    register:
        handler: functions/auth/register/index.handler
        events:
            - httpApi:
                  path: /auth/register
                  method: POST
    login:
        handler: functions/auth/login/index.handler
        events:
            - httpApi:
                  path: /auth/login
                  method: POST
